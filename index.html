<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Discover the KINGSMADE collection. Premium fashion and modern essentials.">
  <title>KINGSMADE | Official Store</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    .hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .38;
      z-index: -1;
      pointer-events: none;
    }

    .hero.is-hidden {
      display: none !important;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="logo" href="/">KINGSMADE</a>
    <button class="cart-btn" type="button" onclick="toggleCart()">
      Cart <span id="cartCount">0</span>
    </button>
  </header>

  <main>
    <section class="hero" id="homepageHero">
      <img
        id="heroBackground"
        class="hero-image"
        alt=""
        hidden
      >

      <div class="hero-content">
        <p class="eyebrow" id="heroEyebrow">EST. 2025</p>
        <h1 id="heroHeading">KINGSMADE COLLECTION</h1>
        <p id="heroSubtitle">Modern essentials by KINGSMADE.</p>

        <a class="shop-btn" id="heroButton" href="#shop">
          SHOP COLLECTION
        </a>
      </div>
    </section>

    <section id="shop" class="shop">
      <div class="section-head">
        <div>
          <p class="eyebrow">KINGSMADE COLLECTION</p>
          <h2>Shop</h2>
        </div>
      </div>

      <div id="products" class="grid"></div>
    </section>
  </main>

  <aside id="cart" class="cart-panel" aria-label="Shopping cart">
    <div class="cart-head">
      <h2>Your cart</h2>
      <button type="button" aria-label="Close cart" onclick="toggleCart(false)">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">₦0</strong>
    </div>

    <button class="checkout" type="button" onclick="checkout()">
      Proceed to checkout
    </button>
  </aside>

  <div
    id="overlay"
    class="overlay"
    onclick="toggleCart(false)"
  ></div>

  <footer>
    <strong>KINGSMADE</strong>
    <p>CRAFT FOR KINGS</p>
    <small>© 2026 KINGSMADE. All rights reserved.</small>
  </footer>

  <script src="/script.js" defer></script>

  <script>
    async function loadKingsmadeHero() {
      const hero = document.getElementById("homepageHero");

      try {
        const response = await fetch("/api/hero", {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) return;

        const data = await response.json();
        const settings = data.hero;

        if (!settings || typeof settings !== "object") return;

        const visible = settings.is_visible === undefined
          ? true
          : Number(settings.is_visible) === 1;

        hero.classList.toggle("is-hidden", !visible);

        if (settings.heading) {
          document.getElementById("heroHeading").textContent =
            settings.heading;
        }

        document.getElementById("heroSubtitle").textContent =
          settings.subtitle || "";

        const button = document.getElementById("heroButton");
        button.textContent =
          settings.button_text || "SHOP COLLECTION";

        button.href = safeHeroDestination(
          settings.button_url || "#shop"
        );

        const image = document.getElementById("heroBackground");
        const imageUrl = settings.image_url || "";
        const safeImage = safeHeroImage(imageUrl);

        if (safeImage) {
          image.src = safeImage;
          image.hidden = false;
        } else {
          image.hidden = true;
          image.removeAttribute("src");
        }
      } catch (error) {
        console.error("KINGSMADE hero loading error:", error);
      }
    }

    function safeHeroDestination(value) {
      if (typeof value !== "string") return "#shop";

      if (value.startsWith("#")) return value;

      try {
        const url = new URL(value, location.origin);

        if (
          url.origin === location.origin &&
          ["http:", "https:"].includes(url.protocol)
        ) {
          return url.href;
        }

        if (url.protocol === "https:") return url.href;
      } catch {}

      return "#shop";
    }

    function safeHeroImage(value) {
      if (typeof value !== "string" || !value.trim()) return "";

      try {
        const url = new URL(value, location.origin);

        if (
          url.origin === location.origin ||
          url.protocol === "https:"
        ) {
          return url.href;
        }
      } catch {}

      return "";
    }

    loadKingsmadeHero();
  </script>
</body>
</html>
